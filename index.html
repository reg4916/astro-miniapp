<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Астролог — натальная карта</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0a14'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E"
    />
    <!-- defer: страница рисуется сразу, даже если telegram.org недоступен -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <style>
      html, body { margin: 0; background: #0a0a14; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 10px; color: #a29dbd;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        text-align: center; padding: 24px;
      }
      #boot .moon { font-size: 28px; }
      #boot .diag { color: #fca5a5; font-size: 12px; white-space: pre-wrap; max-width: 320px; }
    </style>
    <script type="module" crossorigin src="./assets/index-JAY6rbwa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BueOB1j4.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="moon">🌙</div>
      <div>Загрузка приложения…</div>
      <div class="diag" id="diag"></div>
    </div>
    <script>
      (function () {
        var diag = document.getElementById("diag");
        function show(msg) {
          if (diag && !diag.textContent) diag.textContent = msg;
        }
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (t && t.tagName === "SCRIPT") show("Не загрузился скрипт: " + (t.src || "?"));
          else show("Ошибка: " + ((e && e.message) || "unknown"));
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          show("Ошибка: " + ((e.reason && e.reason.message) || String(e.reason)));
        });
        setTimeout(function () {
          if (!window.__appMounted) {
            show(
              "Приложение не запустилось за 8 секунд.\nПроверьте соединение и перезапустите приложение.",
            );
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
